blueprint:
  name: Smart NIBE – Ultra Adaptive (Winter + Ekviterm + Spot)
  description: >
    Nejpokročilejší řízení NIBE. Spouští se 2 minuty po celé hodině.
    Zahrnuje vliv ceny, venkovní teploty (ekviterm), vnitřní teploty a ochranu zápisu.
  domain: automation
  input:
    spot_price:
      name: Spot price sensor
      selector:
        entity:
          domain: sensor
    cheap_block:
      name: Cheapest 6h block sensor
      selector:
        entity:
          domain: sensor
    outdoor_weather:
      name: Weather entity
      selector:
        entity:
          domain: weather
    indoor_temp:
      name: Indoor temperature sensor
      selector:
        entity:
          domain: sensor
    forecast_trend:
      name: Weather forecast trend helper
      selector:
        entity:
          domain: input_number
    hdo:
      name: HDO binary sensor (nepovinné)
      default: none
      selector:
        entity:
          domain: binary_sensor
    current_offset:
      name: Current NIBE offset sensor
      selector:
        entity:
          domain: sensor
    indoor_bias:
      name: Indoor bias helper
      selector:
        entity:
          domain: input_number
    response_gain:
      name: Indoor response gain helper
      selector:
        entity:
          domain: input_number
    mqtt_topic:
      name: MQTT topic
      default: nibe/modbus/47011/set
      selector:
        text:
    target_temp:
      name: Target indoor temperature
      default: 21.5
      selector:
        number:
          min: 18
          max: 24
          step: 0.1
    max_offset:
      name: Max offset
      default: 6
      selector:
        number:
          min: 1
          max: 10
          step: 0.5
    min_offset:
      name: Min offset
      default: -3
      selector:
        number:
          min: -8
          max: -1
          step: 0.5
    min_change:
      name: Min offset change
      default: 0.4
      selector:
        number:
          min: 0.1
          max: 2
          step: 0.1

trigger:
  - platform: time_pattern
    minutes: "2" # Spustí se v 00:02, 01:02, 02:02... atd.

condition:
  - condition: template
    value_template: >
      {% set hdo_input = '!input hdo' %}
      {{ hdo_input == 'none' or is_state(hdo_input, 'on') }}

action:
  - variables:
      spot_entity: !input spot_price
      cheap_entity: !input cheap_block
      weather_entity: !input outdoor_weather
      indoor_entity: !input indoor_temp
      trend_entity: !input forecast_trend
      offset_entity: !input current_offset
      bias_entity: !input indoor_bias
      gain_entity: !input response_gain
      target_temp_var: !input target_temp
      max_offset_var: !input max_offset
      min_offset_var: !input min_offset
      min_change_var: !input min_change

      # Načtení hodnot
      cena: "{{ states(spot_entity) | float(0) }}"
      t_out: "{{ state_attr(weather_entity, 'temperature') | float(0) }}"
      t_in: "{{ states(indoor_entity) | float(target_temp_var) }}"
      trend: "{{ states(trend_entity) | float(0) }}"
      offset_current: "{{ states(offset_entity) | float(0) }}"
      bias: "{{ states(bias_entity) | float(0) }}"
      gain_val: "{{ states(gain_entity) | float(1.2) }}"
      
      # 1. ZÁKLADNÍ OFFSET DLE CENY A VENKOVNÍ TEPLOTY (Ekvitermní posun)
      # Pokud je venku pod nulou, automaticky přidáváme k základu.
      ekvi_posun: "{{ (0 - t_out) / 10 if t_out < 5 else 0 }}"
      offset_spot: "{{ (-0.8 * cena + 4.0 + ekvi_posun) | round(1) }}"
      
      # 2. BONUS ZA LEVNÝ BLOK
      bonus_6h: "{% if is_state(cheap_entity, 'on') %} 1.0 {% else %} 0 {% endif %}"
      
      # 3. KOREKCE DLE VNITŘNÍ TEPLOTY (Agresivní zimní režim)
      indoor_weight: >
        {% set t = trend | abs %}
        {% if t < 0.5 %} 1.5 {% elif t < 1.5 %} 1.2 {% else %} 0.9 {% endif %}

      corr_indoor: >
        {% set d = t_in - (target_temp_var + bias) %}
        {% if d >= 0.8 %} -1.5
        {% elif d >= 0.3 %} -0.7
        {% elif d <= -0.8 %} 2.0
        {% elif d <= -0.3 %} 1.0
        {% else %} 0
        {% endif %}

      corr_indoor_final: "{{ (corr_indoor * indoor_weight * gain_val) | round(2) }}"
      
      # VÝSLEDNÝ VÝPOČET
      offset_calc: "{{ (offset_spot + bonus_6h | float + corr_indoor_final) | round(1) }}"

      # OMEZENÍ MANTINELY
      offset_final: >
        {% if offset_calc | float > max_offset_var | float %} {{ max_offset_var }}
        {% elif offset_calc | float < min_offset_var | float %} {{ min_offset_var }}
        {% else %} {{ offset_calc }}
        {% endif %}

  # KONTROLA ZMĚNY (Ochrana EEPROM)
  - condition: template
    value_template: >
      {% set diff = (offset_current - offset_final | float) | abs %}
      {{ diff >= min_change_var | float }}

  # LOGOVÁNÍ A ZÁPIS
  - service: mqtt.publish
    data:
      topic: "nibe/debug/offset_calc"
      payload: >
        {{
          {
            "cas": now().strftime('%H:%M:%S'),
            "venku": t_out,
            "vnitrek": t_in,
            "cena": cena,
            "ekvi_posun": ekvi_posun | round(2),
            "vypocteny_offset": offset_final | float,
            "zapsano": "ano"
          } | tojson
        }}
      retain: true

  - service: mqtt.publish
    data:
      topic: !input mqtt_topic
      payload: "{{ offset_final | float | int }}"

mode: single