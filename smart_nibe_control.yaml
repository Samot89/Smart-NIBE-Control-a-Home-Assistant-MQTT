blueprint:
  name: Smart NIBE – Adaptive Heat Curve Control (MQTT/Modbus or myUplink) v4.12.2
  description: |
    Adaptive control of a NIBE heat pump: smoothly adjusts the heat curve offset
    (register 47011) – never switches the compressor on/off.

    **Works with** NibePi / any Modbus–MQTT bridge (MQTT write) **or** the NIBE /
    myUplink integration (writes the `number` entity directly) – see *How to write the offset*.

    **7 components:** spot price, equithermal shift, indoor temperature, cheapest block,
    pre-heating before price rise, solar braking, weather forecast trend.

    **Protection:** dead band, step limit, degree minutes guard, minimum write interval
    (EEPROM), HDO blocking.

    **Transparency:** plain-text status and write history via MQTT (optional) – see Helpery.md.
    Optional notification / script after every write (*Actions after a write*).

    Docs, helpers and changelog: https://github.com/Samot89/Smart-NIBE-Control-HA-Modbus-MQTT-myUplink
  domain: automation
  source_url: https://github.com/Samot89/Smart-NIBE-Control-HA-Modbus-MQTT-myUplink/blob/main/smart_nibe_control.yaml
  input:
    # ==========================================
    # BASIC SENSORS
    # ==========================================
    spot_price:
      name: 💰 Spot price sensor
      selector:
        entity:
          domain: sensor

    cheap_block:
      name: ⏰ Cheapest 6h block sensor
      default: none
      selector:
        entity:
          domain: sensor

    degree_minutes:
      name: 🌡️ Degree Minutes sensor
      selector:
        entity:
          domain: sensor

    outdoor_weather:
      name: 🌦️ Weather entity
      selector:
        entity:
          domain: weather

    indoor_temp:
      name: 🏠 Indoor temperature sensor
      selector:
        entity:
          domain: sensor

    forecast_trend:
      name: 📈 Weather forecast trend helper (optional)
      description: >-
        Not needed since v4.8 – the trend (average of the next 6 hours minus the current
        outdoor temperature) is calculated from the hourly forecast of the weather entity above.
        This helper is only used as a fallback when the weather entity provides no hourly
        forecast; it must then be kept up to date by your own automation.
      default: none
      selector:
        entity:
          domain: input_number

    hdo:
      name: ⚡ HDO binary sensor (optional)
      default: none
      selector:
        entity:
          domain: binary_sensor

    current_offset:
      name: 🎚️ Current NIBE offset sensor
      description: Current heat curve offset (register 47011) – a sensor or a number entity.
      selector:
        entity:
          domain:
            - sensor
            - number
            - input_number

    # ==========================================
    # CONTROL PARAMETERS
    # ==========================================
    indoor_bias:
      name: 🎯 Indoor bias
      description: Long-term systematic correction of target temperature (0.0 = no correction)
      selector:
        entity:
          domain: input_number

    response_gain:
      name: 📊 Response gain
      description: Sensitivity multiplier for indoor temperature correction
      selector:
        entity:
          domain: input_number

    # ==========================================
    # OFFSET WRITE / MQTT
    # ==========================================
    offset_write_method:
      name: ✍️ How to write the offset
      description: >
        MQTT – publish to the topic below (NibePi / Modbus–MQTT bridge).
        Entity – set the "Current NIBE offset" entity directly with set_value; it must be a
        number or input_number entity (e.g. NIBE or myUplink integration).
      default: mqtt
      selector:
        select:
          options:
            - label: MQTT topic (NibePi / Modbus–MQTT)
              value: mqtt
            - label: Set the "Current NIBE offset" entity (number)
              value: entity

    mqtt_topic:
      name: 📡 MQTT topic (offset write)
      description: Only used when the offset is written via MQTT.
      default: nibe/modbus/47011/set
      selector:
        text:

    mqtt_debug_topic:
      name: 🔍 MQTT debug topic
      description: Full calculation as JSON on every run, including a plain-text "status".
      default: nibe/debug/offset_calc
      selector:
        text:

    mqtt_history_topic:
      name: 📜 MQTT history topic
      description: >
        After every write a plain-text line (time, old → new offset, reasons) is published here
        (retained, last 20 entries). Add the "NIBE Offset History" MQTT sensor from Helpery.md to
        see the list – the blueprint finds it automatically. Leave empty to disable.
      default: nibe/debug/history
      selector:
        text:

    # ==========================================
    # LIMITS
    # ==========================================
    target_temp:
      name: 🌡️ Target indoor temperature
      description: Fixed target, used when no target temperature entity is selected.
      default: 21.5
      selector:
        number:
          min: 18
          max: 24
          step: 0.1

    target_temp_entity:
      name: 🌡️ Target indoor temperature entity (optional)
      description: >
        Optional – e.g. an input_number helper, so the target can be changed from a
        dashboard or an automation without editing the blueprint. Falls back to the
        fixed target above when not set or not numeric.
      default: none
      selector:
        entity:
          domain:
            - input_number
            - number
            - sensor

    max_offset:
      name: ⬆️ Maximum offset
      default: 6
      selector:
        number:
          min: 1
          max: 10

    min_offset:
      name: ⬇️ Minimum offset
      default: -3
      selector:
        number:
          min: -8
          max: -1

    min_change:
      name: 🔄 Minimum offset change (dead band)
      default: 1
      selector:
        number:
          min: 1
          max: 5

    stable_forecast_min_change:
      name: 🔄 Minimum offset change when the forecast is stable
      description: >
        Used instead of the dead band above when the forecast trend is between −0.2 and
        +0.2 °C. Default 2 keeps the previous behaviour. Set 1 so that one-step corrections
        are written: with 2, a cap or target that moves the offset by one step is never
        applied, and the offset can only jump in steps of 2, which can push degree minutes
        down to where the immersion heater starts.
      default: 2
      selector:
        number:
          min: 1
          max: 5

    min_write_interval_minutes:
      name: ⏱️ Minimum interval between writes (EEPROM protection)
      description: >
        No new offset is written to NIBE until this many minutes have passed since the
        last write. Only enforced when the "last write timestamp" helper below is selected.
        Exception: a write is still allowed when the indoor temperature is 0.7 °C or more
        away from the target (comfort override).
      default: 45
      selector:
        number:
          min: 5
          max: 240
          step: 5

    comfort_override_delta:
      name: 🛟 Comfort override threshold
      description: >
        When the indoor temperature is at least this many °C away from the target, the
        minimum write interval is bypassed so the house is corrected quickly.
        0 = off (the interval is always respected).
      default: 0.7
      selector:
        number:
          min: 0
          max: 3
          step: 0.1
          unit_of_measurement: "°C"

    last_write_helper:
      name: 🕐 Helper for last write timestamp
      description: >
        An input_datetime helper with BOTH date and time. The blueprint stores the time of
        every write here. Required for the minimum write interval above – without it the
        interval is not enforced.
      default: none
      selector:
        entity:
          domain: input_datetime

    run_interval_minutes:
      name: ⏰ Run interval (minutes pattern)
      default: "/2"
      selector:
        text:

    # ==========================================
    # NOTIFICATIONS
    # ==========================================

    notify_message_type:
      name: 💬 Message for the actions below
      description: >
        Which parts make up `{{ nibe_message }}` for the actions after a write – one line each,
        in this order. Each part is also available as its own variable (in brackets).
      default:
        - history
      selector:
        select:
          multiple: true
          options:
            - label: "Short line – time, old → new offset, main reasons (nibe_history_line)"
              value: history
            - label: "Full status text (nibe_status)"
              value: status
            - label: "Offset change, e.g. 'Offset -2 → -1' (nibe_offset_old / nibe_offset_new)"
              value: offsets
            - label: "Calculated value before rounding, e.g. 'Calculated -1.59' (nibe_calculated)"
              value: calculated
            - label: "Main reasons (nibe_reasons)"
              value: reasons
            - label: "Inputs – outdoor, indoor / target, price (nibe_inputs)"
              value: inputs

    on_write_actions:
      name: 🔔 Actions after a write (optional)
      description: >
        Runs after every offset write – e.g. a notify service, a Telegram message or your own
        script. Available variables: `{{ nibe_message }}` (parts selected above), `{{ nibe_status }}`,
        `{{ nibe_history_line }}`, `{{ nibe_offset_old }}`, `{{ nibe_offset_new }}`,
        `{{ nibe_calculated }}`, `{{ nibe_reasons }}`, `{{ nibe_inputs }}`. Example message: `{{ nibe_message }}`.
      default: []
      selector:
        action: {}

trigger:
  - platform: time_pattern
    minutes: !input run_interval_minutes

action:
  # Hourly forecast for the forecast trend. Only called when the weather entity supports an
  # hourly forecast (supported_features bit 2) – otherwise HA raises a validation error that
  # continue_on_error does not catch (e.g. template weather). Without it the optional helper is used.
  - variables:
      forecast_weather: !input outdoor_weather
  - if:
      - condition: template
        value_template: "{{ (state_attr(forecast_weather, 'supported_features') | int(0)) | bitwise_and(2) > 0 }}"
    then:
      - service: weather.get_forecasts
        continue_on_error: true
        target:
          entity_id: "{{ forecast_weather }}"
        data:
          type: hourly
        response_variable: forecast_resp

  - variables:
      spot_ent: !input spot_price
      weather_ent: !input outdoor_weather
      dm_ent: !input degree_minutes
      in_temp_ent: !input indoor_temp
      curr_off_ent: !input current_offset
      cheap_ent: !input cheap_block
      trend_ent: !input forecast_trend
      bias_ent: !input indoor_bias
      gain_ent: !input response_gain
      hdo_ent: !input hdo
      last_write_ent: !input last_write_helper
      # Optional inputs: `default: none` is the string "none" in YAML, not null,
      # and a cleared selector can give "". Treat all of them as "not configured".
      cheap_set: "{{ cheap_ent not in [none, '', 'none'] }}"
      hdo_set: "{{ hdo_ent not in [none, '', 'none'] }}"
      last_write_set: "{{ last_write_ent not in [none, '', 'none'] }}"
      target_temp_fixed: !input target_temp
      target_temp_ent: !input target_temp_entity
      target_temp_set: "{{ target_temp_ent not in [none, '', 'none'] and is_number(states(target_temp_ent)) }}"
      target_temp_var: "{{ states(target_temp_ent) | float if target_temp_set else target_temp_fixed | float }}"
      max_off_limit: !input max_offset
      min_off_limit: !input min_offset
      min_change_limit: !input min_change
      stable_min_change_limit: !input stable_forecast_min_change
      min_write_interval_min: !input min_write_interval_minutes
      preheat_look_ahead: 4
      temp_outdoor_raw: "{{ state_attr(weather_ent, 'temperature') | float(0) }}"
      # Forecast trend = average of the next 6 hourly forecast temperatures − current outdoor temp
      trend_forecast: >
        {% set ns = namespace(t=[]) %}
        {% if forecast_resp is defined and forecast_resp is mapping and weather_ent in forecast_resp %}
          {% for f in (forecast_resp[weather_ent].forecast or [])[:6] %}
            {% if f.temperature is number %}{% set ns.t = ns.t + [f.temperature] %}{% endif %}
          {% endfor %}
        {% endif %}
        {% if ns.t | length > 0 %}{{ ((ns.t | average) - temp_outdoor_raw | float(0)) | round(1) }}{% else %}none{% endif %}
      trend_set: "{{ trend_ent not in [none, '', 'none'] and is_number(states(trend_ent)) }}"
      trend_source: >
        {% if is_number(trend_forecast) %}forecast{% elif trend_set %}helper{% else %}none{% endif %}
      trend_value: >
        {% if trend_source == 'forecast' %}{{ trend_forecast | float }}
        {% elif trend_source == 'helper' %}{{ states(trend_ent) | float(0) }}
        {% else %}0{% endif %}
      temp_indoor: "{{ states(in_temp_ent) | float(target_temp_var) }}"
      dm_value: "{{ states(dm_ent) | float(0) }}"
      # Integrations like myUplink make their entities unavailable for a while after a
      # write – never compute or write from an unknown current offset.
      offset_available: "{{ is_number(states(curr_off_ent)) }}"
      curr_offset: "{{ states(curr_off_ent) | int(0) }}"
      write_method: !input offset_write_method
      comfort_delta: !input comfort_override_delta
      price_now: "{{ states(spot_ent) | float(0) }}"
      weather_state: "{{ states(weather_ent) }}"
      temp_outdoor: "{{ [[-30, temp_outdoor_raw | float(0)] | max, 30] | min }}"
      # Sensors that are unavailable right now (e.g. myUplink dropping out). Their fallback
      # values would distort the calculation, so the offset is held until they are back.
      missing_inputs: >-
        {{ [
          'spot price' if not is_number(states(spot_ent)) else '',
          'indoor temperature' if not is_number(states(in_temp_ent)) else '',
          'outdoor temperature' if not is_number(state_attr(weather_ent, 'temperature')) else ''
        ] | select | join(', ') }}
      hour_index: "{{ now().hour }}"
      now_timestamp: "{{ now().timestamp() }}"

  - variables:
      today_prices_raw: >
        {% set t = state_attr(spot_ent, 'today') %}
        {% if t is none %}{% set t = state_attr(spot_ent, 'raw_today') %}{% endif %}
        {% if t is none %}{% set t = state_attr(spot_ent, 'prices_today') %}{% endif %}
        {{ t }}
      tomorrow_prices_raw: >
        {% set t = state_attr(spot_ent, 'tomorrow') %}
        {% if t is none %}{% set t = state_attr(spot_ent, 'raw_tomorrow') %}{% endif %}
        {% if t is none %}{% set t = state_attr(spot_ent, 'prices_tomorrow') %}{% endif %}
        {{ t }}
      today_prices_list: >
        {% set t = today_prices_raw %}
        {% if t is mapping and ('values' in t or 'prices' in t) %}
          {% set t = t['values'] if 'values' in t else t['prices'] %}
        {% endif %}
        {% if t is mapping %}
          {% set vals = t | dictsort | map(attribute=1) | list %}
          {% if vals | length > 0 and vals[0] is not mapping %}
            {{ vals | list }}
          {% elif vals | length > 0 %}
            {% for key in ['value', 'price', 'price_with_tax'] %}
              {% if key in vals[0] %}
                {{ vals | map(attribute=key) | list }}
                {% break %}
              {% endif %}
            {% endfor %}
          {% else %}[]{% endif %}
        {% elif t is iterable and t is not string %}
          {{ t | list }}
        {% else %}[]{% endif %}
      tomorrow_prices_list: >
        {% set t = tomorrow_prices_raw %}
        {% if t is mapping and ('values' in t or 'prices' in t) %}
          {% set t = t['values'] if 'values' in t else t['prices'] %}
        {% endif %}
        {% if t is mapping %}
          {% set vals = t | dictsort | map(attribute=1) | list %}
          {% if vals | length > 0 and vals[0] is not mapping %}
            {{ vals | list }}
          {% elif vals | length > 0 %}
            {% for key in ['value', 'price', 'price_with_tax'] %}
              {% if key in vals[0] %}
                {{ vals | map(attribute=key) | list }}
                {% break %}
              {% endif %}
            {% endfor %}
          {% else %}[]{% endif %}
        {% elif t is iterable and t is not string %}
          {{ t | list }}
        {% else %}[]{% endif %}
      all_prices: >
        {% set t = today_prices_list %}
        {% set tm = tomorrow_prices_list %}
        {{ (t + tm) if (t is iterable and tm is iterable) else (t if t is iterable else []) }}
      preheat_price: >
        {% set idx = (hour_index | int) + (preheat_look_ahead | int) %}
        {% if all_prices is iterable and all_prices | length > idx %}
          {{ all_prices[idx] | float(price_now) }}
        {% else %}{{ price_now }}{% endif %}

  - variables:
      # 1. PREHEAT BONUS
      preheat_bonus: >
        {% if preheat_price | float > (price_now | float * 1.3) and price_now | float < 2.5 %}
          1.5
        {% else %}0.0{% endif %}

      # 2. SOLAR MALUS (9:00–15:00 on sunny days)
      solar_malus: >
        {% if 9 <= now().hour <= 15 %}
          {% set state = weather_state | lower %}
          {% if state in ['sunny', 'clear'] %}-1.0
          {% elif 'cloud' in state %}-0.5
          {% else %}0.0{% endif %}
        {% else %}0.0{% endif %}

      # 3. FORECAST BONUS (based on weather trend)
      forecast_bonus: >
        {{ [[trend_value | float * -0.4, 1] | min, -1] | max | round(2) }}

      # 4. EQUITHERMAL SHIFT (outdoor temp below 5°C)
      equi_shift: >
        {% if temp_outdoor | float < 5 %}
          {{ (0 - temp_outdoor | float) / 10 }}
        {% else %}0{% endif %}

      # 5. INDOOR CORRECTION (non-linear response)
      gain_value: "{{ states(gain_ent) | float(1.2) }}"
      bias_value: "{{ states(bias_ent) | float(0) }}"
      temp_diff: "{{ temp_indoor | float - (target_temp_var | float + bias_value | float) }}"
      indoor_correction: >
        {% set d = temp_diff | float %}
        {% if d >= 0.8 %}-1.5
        {% elif d >= 0.3 %}-0.7
        {% elif d <= -0.8 %}2.0
        {% elif d <= -0.3 %}1.0
        {% else %}0.0{% endif %}

      # 6. CHEAP 6H BLOCK BONUS
      cheap_block_bonus: >
        {% if cheap_set and is_state(cheap_ent, 'on') %}1.0
        {% else %}0{% endif %}

      # 7. SPOT PRICE INFLUENCE (v4.4: reduced 3×)
      spot_influence_raw: "{{ (-0.3 * price_now | float) + 1.5 }}"


  - variables:
      # MAIN CALCULATION (8 COMPONENTS)
      raw_calc: >
        {{ spot_influence_raw | float + equi_shift | float + cheap_block_bonus | float +
           (indoor_correction | float * gain_value | float) + preheat_bonus | float +
           solar_malus | float + forecast_bonus | float }}

      max_step: "{% if dm_value | float < -800 %}1{% else %}2{% endif %}"

      clamped_calc: >
        {% set val = raw_calc | float %}
        {% if temp_outdoor | float < -15 and val > 2.0 %}2
        {% elif val > max_off_limit | float %}{{ max_off_limit | int }}
        {% elif val < min_off_limit | float %}{{ min_off_limit | int }}
        {% else %}{{ val | round | int }}{% endif %}

      offset_final: >
        {% set target = clamped_calc | int %}
        {% set current = curr_offset | int %}
        {% set diff = target - current %}
        {% set step = max_step | int %}
        {% if missing_inputs | trim %}{{ current }}
        {% elif diff > step %}{{ current + step }}
        {% elif diff < -step %}{{ current - step }}
        {% else %}{{ target }}{% endif %}

      effective_min_change: >
        {% if trend_value | float | abs < 0.2 %}{{ stable_min_change_limit | int }}
        {% else %}{{ min_change_limit | int }}{% endif %}

  - variables:
      last_write_ts: >
        {% if not last_write_set %}0
        {% else %}
          {% set dt = state_attr(last_write_ent, 'datetime') %}
          {% if dt is none %}{% set dt = states(last_write_ent) %}{% endif %}
          {{ as_timestamp(dt, 0) | float }}
        {% endif %}
      minutes_since_write: "{{ ((now_timestamp - last_write_ts) / 60) | round(1) }}"
      comfort_override: "{{ comfort_delta | float > 0 and temp_diff | float | abs >= comfort_delta | float }}"
      allow_write_by_time: >
        {{ not last_write_set or
           minutes_since_write | float >= min_write_interval_min | float }}

  # PLAIN-TEXT STATUS (what is happening and why)
  - variables:
      offset_change: "{{ offset_final | int - curr_offset | int }}"
      history_topic: !input mqtt_history_topic
      history_set: "{{ history_topic not in [none, '', 'none'] }}"
      # History sensor (found by its history_topic attribute) remembers the last written offset
      history_ent: >-
        {{ states.sensor | selectattr('attributes.history_topic', 'defined')
           | selectattr('attributes.history_topic', 'eq', history_topic)
           | map(attribute='entity_id') | first | default('') if history_set else '' }}
      last_written_offset: "{{ state_attr(history_ent, 'last_offset') if history_ent else none }}"
      minutes_since_hist_write: >-
        {{ ((now_timestamp | float - as_timestamp(state_attr(history_ent, 'last_write'), 0)) / 60) | round(0)
           if history_ent else 9999 }}
      # Cloud integrations (myUplink) report the new offset with a delay – for 15 min after a
      # write, treat a differing current offset as "not confirmed yet" instead of re-writing.
      write_pending: >-
        {{ last_written_offset is number and minutes_since_hist_write | float < 15
           and curr_offset | int != last_written_offset | int
           and offset_final | int == last_written_offset | int }}
      # Mirrors the write conditions below – first one that blocks the write
      block_reason: >-
        {% if not offset_available %}current offset unavailable
        {%- elif write_pending %}waiting for NIBE to confirm {{ last_written_offset | int }} (written {{ minutes_since_hist_write | int }} min ago)
        {%- elif offset_change | int == 0 %}
        {%- elif hdo_set and not is_state(hdo_ent, 'on') %}HDO blocking
        {%- elif missing_inputs | trim %}unavailable: {{ missing_inputs | trim }}
        {%- elif offset_change | int | abs < effective_min_change | int %}change below dead band ({{ effective_min_change | int }})
        {%- elif not (allow_write_by_time or comfort_override) %}write interval {{ minutes_since_write | float | round(0) | int }}/{{ min_write_interval_min | int }} min
        {%- endif %}
      will_write: "{{ offset_change | int != 0 and block_reason | trim == '' }}"
      # Up to 3 strongest components (|value| >= 0.3) as text
      status_reasons: >-
        {% set items = [
          [spot_influence_raw | float, ('cheap' if spot_influence_raw | float > 0 else 'expensive') ~ ' electricity (' ~ (price_now | float | round(2)) ~ ')'],
          [equi_shift | float, 'outdoor ' ~ (temp_outdoor | float | round(1)) ~ ' °C'],
          [indoor_correction | float * gain_value | float, 'house ' ~ (temp_diff | float | abs | round(1)) ~ ' °C ' ~ ('below' if temp_diff | float < 0 else 'above') ~ ' target'],
          [cheap_block_bonus | float, 'cheapest 6h block'],
          [preheat_bonus | float, 'pre-heating before price rise'],
          [solar_malus | float, 'solar gain expected'],
          [forecast_bonus | float, ('colder' if trend_value | float < 0 else 'warmer') ~ ' weather coming (' ~ (trend_value | float | round(1)) ~ ' °C in 6 h)']
        ] %}
        {% set ns = namespace(r=[]) %}
        {% for i in items %}{% if i[0] | abs >= 0.3 %}{% set ns.r = ns.r + [[i[0] | abs, i[1] ~ ' ' ~ ('%+.1f' | format(i[0]))]] %}{% endif %}{% endfor %}
        {{ (ns.r | sort(attribute='0', reverse=true) | map(attribute='1') | list)[:3] | join(', ') }}
      status_text: >-
        {% set r = status_reasons | trim %}
        {% set b = block_reason | trim %}
        {% set c = ' (calculated ' ~ (raw_calc | float | round(2)) ~ ')' %}
        {% if not offset_available %}Waiting – current offset unavailable
        {%- elif missing_inputs | trim %}Holding at {{ curr_offset | int }} – unavailable: {{ missing_inputs | trim }}
        {%- elif write_pending %}Offset {{ last_written_offset | int }} written {{ minutes_since_hist_write | int }} min ago – waiting for NIBE to report it (still shows {{ curr_offset | int }})
        {%- elif offset_change | int == 0 %}Holding at {{ curr_offset | int }}{{ c }}{{ ': ' ~ r if r else '' }}
        {%- elif b %}Holding at {{ curr_offset | int }} (target {{ offset_final | int }}, calculated {{ raw_calc | float | round(2) }}) – {{ b }}{{ ' · ' ~ r if r else '' }}
        {%- else %}{{ 'Raising' if offset_change | int > 0 else 'Lowering' }} offset {{ curr_offset | int }} → {{ offset_final | int }}{{ c }}{{ ': ' ~ r if r else '' }}
        {%- endif %}

  # MQTT DEBUG PUBLISH (optional – ignored when MQTT is not set up, e.g. myUplink-only)
  - service: mqtt.publish
    continue_on_error: true
    data:
      topic: !input mqtt_debug_topic
      payload: >
        {% set spot_influence = spot_influence_raw | float %}
        {% set indoor_influence = indoor_correction | float * gain_value | float %}
        {% set equi_influence = equi_shift | float %}
        {{
          {
            "status": status_text,
            "metadata": {
              "version": "4.12.2",
              "timestamp": now().isoformat(),
              "components_count": 7
            },
            "offset": {
              "final": offset_final | int,
              "current": curr_offset | int,
              "change": offset_final | int - curr_offset | int,
              "raw_calculation": raw_calc | round(3)
            },
            "input_sensors": {
              "spot_price": {"value": price_now | round(3), "unit": "currency/kWh"},
              "outdoor_temperature": {"value": temp_outdoor | round(2), "weather_state": weather_state},
              "indoor_temperature": {"value": temp_indoor | round(2), "diff_from_target": temp_diff | round(3)},
              "target_temperature": {"value": target_temp_var | float | round(2), "bias": bias_value | float | round(2), "source": target_temp_ent if target_temp_set else "fixed"},
              "degree_minutes": {"value": dm_value | round(0), "alarm": dm_value | float < -800}
            },
            "offset_calculation": {
              "total_sum": raw_calc | round(3),
              "component_breakdown": {
                "1_spot_price_influence": {
                  "value": spot_influence | round(3),
                  "formula": "(-0.3 × price) + 1.5",
                  "calculation": "(-0.3 × " ~ (price_now | round(2)) ~ ") + 1.5",
                  "percent_of_total": ((spot_influence / raw_calc * 100) if raw_calc != 0 else 0) | round(1)
                },
                "2_equithermal_shift": {
                  "value": equi_influence | round(3),
                  "formula": "(0 - temp_outdoor) / 10 if temp_outdoor < 5°C",
                  "active": temp_outdoor < 5,
                  "percent_of_total": ((equi_influence / raw_calc * 100) if raw_calc != 0 else 0) | round(1)
                },
                "3_indoor_correction": {
                  "value": indoor_influence | round(3),
                  "base_correction": indoor_correction | float | round(3),
                  "gain": gain_value | round(2),
                  "percent_of_total": ((indoor_influence / raw_calc * 100) if raw_calc != 0 else 0) | round(1)
                },
                "4_bonus_6h_block": {
                  "value": cheap_block_bonus | float | round(3),
                  "active": cheap_block_bonus | float != 0,
                  "configured": cheap_set,
                  "entity": cheap_ent,
                  "state": is_state(cheap_ent, 'on') if cheap_set else false,
                  "percent_of_total": ((cheap_block_bonus | float / raw_calc * 100) if raw_calc != 0 else 0) | round(1)
                },
                "5_preheat_bonus": {
                  "value": preheat_bonus | float | round(3),
                  "price_in_Xh": preheat_price | round(3),
                  "current_price": price_now | round(3),
                  "ratio": ((preheat_price / price_now) if price_now > 0 else 0) | round(2),
                  "active": preheat_bonus | float != 0,
                  "percent_of_total": ((preheat_bonus | float / raw_calc * 100) if raw_calc != 0 else 0) | round(1)
                },
                "6_solar_malus": {
                  "value": solar_malus | float | round(3),
                  "weather_state": weather_state,
                  "active": solar_malus | float != 0,
                  "percent_of_total": ((solar_malus | float / raw_calc * 100) if raw_calc != 0 else 0) | round(1)
                },
                "7_forecast_bonus": {
                  "value": forecast_bonus | float | round(3),
                  "trend": trend_value | float | round(3),
                  "trend_source": trend_source,
                  "percent_of_total": ((forecast_bonus | float / raw_calc * 100) if raw_calc != 0 else 0) | round(1)
                },
                "8_cop_bonus": {
                  "value": 0,
                  "removed": "v4.11.2 – COP component no longer used",
                  "active": false,
                  "percent_of_total": 0
                }
              },
              "control_sum": (spot_influence + equi_influence + indoor_influence + (cheap_block_bonus | float) + (preheat_bonus | float) + (solar_malus | float) + (forecast_bonus | float)) | round(3)
            },
            "protection_and_limits": {
              "dm_guard": {"degree_minutes": dm_value | round(0), "max_step": max_step | int},
              "eeprom_protection": {"minutes_since_write": minutes_since_write | float, "write_allowed": allow_write_by_time or comfort_override, "interval_ok": allow_write_by_time, "comfort_override": comfort_override, "comfort_override_delta": comfort_delta | float}
            },
            "decision": {
              "will_write": will_write,
              "write_pending": write_pending,
              "blocked_by": block_reason | trim,
              "missing_inputs": missing_inputs | trim,
              "calculated": raw_calc | float | round(2),
              "write_method": write_method,
              "checks": {
                "sensors_available": states(spot_ent) != 'unavailable' and states(weather_ent) != 'unavailable',
                "current_offset_available": offset_available,
                "sufficient_change": (curr_offset | int - offset_final | int) | abs >= effective_min_change | int
              }
            }
          } | tojson
        }}
      retain: true

  - condition: template
    value_template: "{{ not hdo_set or is_state(hdo_ent, 'on') }}"
  - condition: template
    value_template: "{{ states(spot_ent) != 'unavailable' }}"
  - condition: template
    value_template: "{{ not (missing_inputs | trim) }}"
  - condition: template
    value_template: "{{ offset_available }}"
  - condition: template
    value_template: "{{ (curr_offset | int - offset_final | int) | abs >= effective_min_change | int }}"
  - condition: template
    value_template: "{{ allow_write_by_time or comfort_override }}"
  - condition: template
    value_template: "{{ not write_pending }}"

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ write_method == 'entity' }}"
        sequence:
          - service: "{{ curr_off_ent.split('.')[0] }}.set_value"
            target:
              entity_id: "{{ curr_off_ent }}"
            data:
              value: "{{ offset_final | int }}"
    default:
      - service: mqtt.publish
        data:
          topic: !input mqtt_topic
          payload: "{{ offset_final | int }}"

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ last_write_set }}"
        sequence:
          - service: input_datetime.set_datetime
            data:
              entity_id: "{{ last_write_ent }}"
              timestamp: "{{ now_timestamp }}"

  # HISTORY – logbook entry on the offset entity + retained MQTT list (last 20)
  - variables:
      history_entry: >-
        {{ now().strftime('%d.%m. %H:%M') }} offset {{ curr_offset | int }} → {{ offset_final | int }}{{ ': ' ~ (status_reasons | trim) if status_reasons | trim else '' }}
  - service: logbook.log
    data:
      name: "Smart NIBE"
      message: "{{ history_entry }}"
      entity_id: "{{ curr_off_ent }}"
  - if:
      - condition: template
        value_template: "{{ history_set }}"
    then:
      - service: mqtt.publish
        continue_on_error: true
        data:
          topic: "{{ history_topic }}"
          retain: true
          payload: >-
            {% set e = state_attr(history_ent, 'entries') if history_ent else none %}
            {% set old = e if e is iterable and e is not string and e is not mapping else [] %}
            {{ {"history_topic": history_topic, "last": history_entry, "last_offset": offset_final | int,
                "last_write": now().isoformat(), "entries": ([history_entry] + old)[:20]} | tojson }}

  # NOTIFICATIONS – user actions after a write (optional, last step)
  - variables:
      notify_type: !input notify_message_type
      nibe_history_line: "{{ history_entry }}"
      nibe_status: "{{ status_text | trim }}"
      nibe_offset_old: "{{ curr_offset | int }}"
      nibe_offset_new: "{{ offset_final | int }}"
      nibe_reasons: "{{ status_reasons | trim }}"
      nibe_calculated: "{{ raw_calc | float | round(2) }}"
      nibe_inputs: >-
        {{ 'Outdoor ' ~ (temp_outdoor | float | round(1)) ~ ' °C, indoor ' ~ (temp_indoor | float | round(1))
           ~ ' °C (target ' ~ ((target_temp_var | float + bias_value | float) | round(1)) ~ ' °C), price '
           ~ (price_now | float | round(2)) }}
      nibe_message: >-
        {% set t = notify_type %}
        {% if t is string %}{% set t = ['history', 'status'] if t == 'both' else [t] %}{% endif %}
        {% set parts = {
          'history': history_entry,
          'status': status_text | trim,
          'offsets': 'Offset ' ~ (curr_offset | int) ~ ' → ' ~ (offset_final | int),
          'calculated': 'Calculated ' ~ (raw_calc | float | round(2)),
          'reasons': status_reasons | trim,
          'inputs': nibe_inputs
        } %}
        {% set ns = namespace(l=[]) %}
        {% for k in (t if t is iterable else ['history']) %}{% if k in parts and parts[k] %}{% set ns.l = ns.l + [parts[k]] %}{% endif %}{% endfor %}
        {{ (ns.l if ns.l else [history_entry]) | join('\n') }}
  - choose: []
    default: !input on_write_actions

mode: single
