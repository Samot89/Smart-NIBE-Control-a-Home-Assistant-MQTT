#Definice helperů
#📌 input_number.weather_forecast_avg_6h

#Význam:
#Průměrná venkovní teplota pro následujících 6 hodin.

input_number:
  weather_forecast_avg_6h:
    name: Forecast avg temperature (6h)
    min: -40
    max: 40
    step: 0.1
    unit_of_measurement: "°C"
	

#📌 input_number.weather_forecast_trend

#Význam:
#Trend počasí = rozdíl mezi budoucí a aktuální venkovní teplotou.

input_number:
  weather_forecast_trend:
    name: Forecast temperature trend
    min: -20
    max: 20
    step: 0.1
    unit_of_measurement: "°C"
