alias: Weather – Update forecast helpers
description: >
  Vypočítá průměrnou teplotu na 6h a trend počasí
  a uloží je do input_number helperů.
mode: single

trigger:
  - platform: time_pattern
    minutes: "0"

condition:
  - condition: template
    value_template: >
      {{ state_attr('weather.domov_2','forecast') != none }}

action:
  - variables:
      t_now: "{{ state_attr('weather.domov_2','temperature') | float }}"
      forecast: "{{ state_attr('weather.domov_2','forecast')[0:6] }}"
      avg_6h: >
        {{ (forecast | map(attribute='temperature') | list | average) | round(1) }}
      trend: >
        {{ (avg_6h - t_now) | round(1) }}

  - service: input_number.set_value
    target:
      entity_id: input_number.weather_forecast_avg_6h
    data:
      value: "{{ avg_6h }}"

  - service: input_number.set_value
    target:
      entity_id: input_number.weather_forecast_trend
    data:
      value: "{{ trend }}"
