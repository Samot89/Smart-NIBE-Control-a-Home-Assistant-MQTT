blueprint:
  name: Smart NIBE – Ultra Adaptive FINAL v2.9.2
  description: https://github.com/Samot89/Smart-NIBE-Control-a-Home-Assistant-MQTT.git    
  domain: automation
  input:
    spot_price:
      name: Spot price sensor
      selector:
        entity:
          domain: sensor
    cheap_block:
      name: Cheapest 6h block sensor
      selector:
        entity:
          domain: sensor
    degree_minutes:
      name: Degree Minutes sensor
      selector:
        entity:
          domain: sensor
    outdoor_weather:
      name: Weather entity
      selector:
        entity:
          domain: weather
    indoor_temp:
      name: Indoor temperature sensor
      selector:
        entity:
          domain: sensor
    forecast_trend:
      name: Weather forecast trend helper
      selector:
        entity:
          domain: input_number
    hdo:
      name: HDO binary sensor (nepovinné)
      default: none
      selector:
        entity:
          domain: binary_sensor
    current_offset:
      name: Current NIBE offset sensor
      selector:
        entity:
          domain: sensor
    indoor_bias:
      name: Indoor bias helper
      selector:
        entity:
          domain: input_number
    response_gain:
      name: Indoor response gain helper
      selector:
        entity:
          domain: input_number
    mqtt_topic:
      name: MQTT topic
      default: nibe/modbus/47011/set
      selector:
        text:
    target_temp:
      name: Target indoor temperature
      default: 21.5
      selector:
        number:
          min: 18
          max: 24
          step: 0.1
    max_offset:
      name: Max offset
      default: 6.0
      selector:
        number:
          min: 1
          max: 10
          step: 0.5
    min_offset:
      name: Min offset
      default: -3.0
      selector:
        number:
          min: -8
          max: -1
          step: 0.5
    min_change:
      name: Min offset change
      default: 0.2
      selector:
        number:
          min: 0.1
          max: 2.0
          step: 0.1

trigger:
  - platform: time_pattern
    minutes: 2

action:
  - variables:
      spot_ent: !input spot_price
      weather_ent: !input outdoor_weather
      dm_ent: !input degree_minutes
      in_temp_ent: !input indoor_temp
      curr_off_ent: !input current_offset
      cheap_ent: !input cheap_block
      trend_ent: !input forecast_trend
      bias_ent: !input indoor_bias
      gain_ent: !input response_gain
      hdo_ent: !input hdo
      mqtt_topic_var: !input mqtt_topic
      target_temp_var: !input target_temp
      max_off_limit: !input max_offset
      min_off_limit: !input min_offset
      min_change_limit: !input min_change
      
      t_out: "{{ state_attr(weather_ent, 'temperature') | float(0) }}"
      t_in: "{{ states(in_temp_ent) | float(target_temp_var) }}"
      dm_val: "{{ states(dm_ent) | float(0) }}"
      off_curr: "{{ states(curr_off_ent) | float(0) }}"
      cena_ted: "{{ states(spot_ent) | float(0) }}"
      stav_pocasi: "{{ states(weather_ent) }}"

      # 1. PŘEDTOPENÍ SE ZABEZPEČENÍM PROTI CHYBĚ
      h_index: "{{ now().hour }}"
      today_prices: "{{ state_attr(spot_ent, 'today') }}"
      cena_budoucich: >
        {% if today_prices is iterable and today_prices | length > (h_index + 2) %}
          {{ today_prices[h_index + 2] | float(cena_ted) }}
        {% else %}
          {{ cena_ted }}
        {% endif %}
      
      preheat_bonus: >
        {% if cena_budoucich > (cena_ted * 1.3) and cena_ted < 2.5 %} 1.2
        {% else %} 0.0
        {% endif %}

      # 2. SOLÁRNÍ ZISKY
      solar_malus: >
        {% if stav_pocasi == 'sunny' and 8 <= now().hour <= 16 %} -0.8
        {% else %} 0.0
        {% endif %}

      # 3. ZÁKLADNÍ VÝPOČET
      ekvi_posun: "{{ (0 - t_out) / 10 if t_out < 5 else 0 }}"
      gain_val: "{{ states(gain_ent) | float(1.2) }}"
      bias_val: "{{ states(bias_ent) | float(0) }}"
      bonus_6h: "{% if is_state(cheap_ent, 'on') %} 0.8 {% else %} 0 {% endif %}"
      
      corr_indoor: >
        {% set d = t_in - (target_temp_var + bias_val) %}
        {% if d >= 0.8 %} -1.5
        {% elif d >= 0.3 %} -0.7
        {% elif d <= -0.8 %} 2.0
        {% elif d <= -0.3 %} 1.0
        {% else %} 0
        {% endif %}

      raw_calc: "{{ (-0.8 * cena_ted + 4.0 + ekvi_posun + (bonus_6h | float) + (corr_indoor * gain_val) + preheat_bonus + solar_malus) | round(1) }}"

      # 4. DM GUARD & CLAMPING
      max_step: "{{ 0.5 if dm_val < -500 else 1.0 }}"
      
      clamped_calc: >
        {% set val = raw_calc | float %}
        {% if t_out < -15 and val > 2.0 %} 2.0
        {% elif val > max_off_limit | float %} {{ max_off_limit | float }}
        {% elif val < min_off_limit | float %} {{ min_off_limit | float }}
        {% else %} {{ val }}
        {% endif %}

      # 5. FINÁLNÍ OFFSET (SLEW RATE)
      offset_final: >
        {% set diff = clamped_calc | float - off_curr | float %}
        {% if diff > max_step | float %} {{ (off_curr | float + max_step | float) | round(1) }}
        {% elif diff < -1.0 %} {{ (off_curr | float - 1.0) | round(1) }}
        {% else %} {{ clamped_calc | float | round(1) }}
        {% endif %}

  - condition: template
    value_template: "{{ hdo_ent == 'none' or is_state(hdo_ent, 'on') }}"

  - condition: template
    value_template: "{{ (off_curr - offset_final | float) | abs >= min_change_limit | float }}"

  - service: mqtt.publish
    data:
      topic: "nibe/debug/offset_calc"
      payload: >
        {{
          {
            "stav": "ultra_smart_run_ok",
            "stupnominuty": dm_val,
            "preheat": preheat_bonus,
            "solar": solar_malus,
            "vypocet": offset_final | float
          } | tojson
        }}
      retain: true

  - service: mqtt.publish
    data:
      topic: !input mqtt_topic
      payload: "{{ offset_final | float }}"

mode: single
